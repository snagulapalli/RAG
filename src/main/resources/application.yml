server:
  port: 8080

rag:
  data-dir: data
  persist-dir: faiss_store
  embedding-model: all-MiniLM-L6-v2
  chunk-size: 1000
  chunk-overlap: 200
  max-distance: 1.2
  # OpenAI-compatible chat API. Defaults to a local Ollama server.
  # Any non-empty key works for Ollama; it does not check the value.
  # For Groq cloud instead: base URL https://api.groq.com/openai/v1 and a real GROQ_API_KEY.
  groq-api-key: ${GROQ_API_KEY:ollama}
  groq-base-url: http://localhost:11434/v1
  # Small local model. A 20B model is slow on an Intel Mac.
  llm-model: llama3.2:3b
  # Set false once indexes exist (mirrors commenting out the build block in app.py)
  build-index-on-startup: true
  run-query-on-startup: true
  default-query: What is attention mechanism?
  default-top-k: 3

logging:
  level:
    com.example.rag: INFO
